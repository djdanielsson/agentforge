[project]
name = "aiw-api"
version = "0.1.0"
description = "AI Workbench control-plane API"
requires-python = ">=3.11"
dependencies = [
    "aiw-shared",
    "aiw-workspace-controller",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiw_api"]

[tool.uv.sources]
aiw-shared = { workspace = true }
aiw-workspace-controller = { workspace = true }
