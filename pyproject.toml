[project]
name = "ai-workbench"
version = "0.1.0"
description = "Self-hosted AI engineering control plane"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["shared", "api", "orchestrator", "workspace-controller"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["shared/src", "api/src", "orchestrator/src", "workspace-controller/src"]
