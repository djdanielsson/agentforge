[project]
name = "agentforge"
version = "0.1.0"
description = "Self-hosted AI engineering control plane"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["packages/shared", "packages/workspaces", "apps/api", "apps/orchestrator", "apps/cli"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency injection is expressed as a call in an argument default,
# which is exactly what B008 warns about. It is the framework's idiom.
"apps/api/src/agentforge_api/routers/*.py" = ["B008"]
"apps/api/src/agentforge_api/security.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/shared/src", "apps/api/src", "apps/orchestrator/src", "packages/workspaces/src", "apps/cli/src"]
