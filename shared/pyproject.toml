[project]
name = "aiw-shared"
version = "0.1.0"
description = "Shared domain model, settings and schemas for AI Workbench"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiw_shared"]
