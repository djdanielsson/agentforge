[project]
name = "agentforge-workspaces"
version = "0.1.0"
description = "Provisions isolated per-project workspaces on Kubernetes"
requires-python = ">=3.11"
dependencies = [
    "agentforge-shared",
    "kubernetes>=29.0",
    "pydantic>=2.7",
]

[project.scripts]
aiw-workspace = "agentforge_workspaces.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentforge_workspaces"]

[tool.uv.sources]
agentforge-shared = { workspace = true }
