[project]
name = "agentforge-agent-server"
version = "0.1.0"
description = "Client for the OpenHands Agent Server execution layer"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "websockets>=12.0",
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentforge_agent_server"]
