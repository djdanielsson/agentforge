# ServiceAccount shared by the API and the orchestrator.
#
# Kept alongside the RBAC because the ClusterRoleBinding needs the account to
# exist in a known namespace, and bootstrapping this by hand is exactly the case
# where the Helm chart's ServiceAccount is not in play.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentforge-control-plane
  namespace: agentforge
  labels:
    app.kubernetes.io/part-of: agentforge
    app.kubernetes.io/component: control-plane
