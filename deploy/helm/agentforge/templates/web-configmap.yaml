{{/*
nginx serves the built dashboard and proxies /api to the API Service, so the
browser talks to a single origin: no CORS, and the WebSocket event stream rides
the same connection. The config is templated because it needs the Service name
and port the release actually created.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentforge.web.fullname" . }}
  labels:
    {{- include "agentforge.componentLabels" (dict "root" $ "component" "web") | nindent 4 }}
data:
  default.conf: |
    # $connection_upgrade is "upgrade" only when the client asked to upgrade, so
    # ordinary requests keep a normal Connection header.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen {{ .Values.web.containerPort }};
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Static probe target; never touches the API.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # The prefix is preserved: the control plane serves /api/v1/... and
        # /api/v1/docs, so rewriting here would break every route.
        location /api/ {
            proxy_pass http://{{ include "agentforge.api.fullname" . }}:{{ .Values.api.service.port }};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # The project event stream is long-lived; do not cut it off.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # Everything else is the single-page app, so unknown paths fall back to
        # index.html rather than 404.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
