apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentforge.web.fullname" . }}
  labels:
    {{- include "agentforge.componentLabels" (dict "root" $ "component" "web") | nindent 4 }}
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "agentforge.componentSelectorLabels" (dict "root" $ "component" "web") | nindent 4 }}
