{{/*
One Secret per release, unless the operator brings their own for the database
URL and/or the bootstrap key. Credentials only ever come from values or an
existing Secret; nothing here has a literal default.

Keys:
  database-url      - present when the chart knows the connection string
  bootstrap-api-key - present unless auth.existingSecret is set
  postgres-password - present when the bundled database is enabled
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentforge.secretName" . }}
  labels:
    {{- include "agentforge.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not (and (not .Values.postgres.enabled) .Values.externalDatabase.existingSecret) }}
  # Assembled here so the connection string exists in exactly one place.
  database-url: {{ include "agentforge.databaseUrl" . | quote }}
  {{- end }}
  {{- if not .Values.auth.existingSecret }}
  bootstrap-api-key: {{ .Values.auth.bootstrapApiKey | quote }}
  {{- end }}
  {{- if .Values.postgres.enabled }}
  # Consumed by the Postgres container as POSTGRES_PASSWORD.
  postgres-password: {{ .Values.postgres.auth.password | quote }}
  {{- end }}
