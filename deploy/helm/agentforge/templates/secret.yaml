{{/*
One Secret per release, holding only the credentials the chart is responsible
for. Any of them can be handed to an operator-managed Secret instead, which is
what a public GitOps repository requires: this file must never be the reason a
password ends up in git.

  postgres.auth.existingSecret     supplies `database-url` and `postgres-password`
  externalDatabase.existingSecret  supplies `database-url`
  auth.existingSecret              supplies `bootstrap-api-key`

When every key has an owner, no Secret is rendered at all.
*/}}
{{- $ownsDatabase := not (or
      (and (not .Values.postgres.enabled) .Values.externalDatabase.existingSecret)
      (and .Values.postgres.enabled .Values.postgres.auth.existingSecret)) -}}
{{- $ownsPostgresPassword := and .Values.postgres.enabled (not .Values.postgres.auth.existingSecret) -}}
{{- $ownsBootstrap := not .Values.auth.existingSecret -}}
{{- if or $ownsDatabase $ownsPostgresPassword $ownsBootstrap }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentforge.secretName" . }}
  labels:
    {{- include "agentforge.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $ownsDatabase }}
  # Assembled here so the connection string exists in exactly one place.
  database-url: {{ include "agentforge.databaseUrl" . | quote }}
  {{- end }}
  {{- if $ownsBootstrap }}
  bootstrap-api-key: {{ .Values.auth.bootstrapApiKey | quote }}
  {{- end }}
  {{- if $ownsPostgresPassword }}
  # Consumed by the Postgres container as POSTGRES_PASSWORD.
  postgres-password: {{ .Values.postgres.auth.password | quote }}
  {{- end }}
{{- end }}
