{{/*
Fail fast on contradictory or unrenderable configurations. Helm has no
pre-render validation hook, so the checks live at the top of the ConfigMap, which
is always rendered.
*/}}
{{- if and .Values.postgres.enabled (or .Values.externalDatabase.url .Values.externalDatabase.existingSecret) -}}
{{- fail "postgres.enabled=true cannot be combined with externalDatabase.{url,existingSecret}. Disable the bundled database first." -}}
{{- end }}
{{- if and .Values.ingress.enabled (not .Values.ingress.host) -}}
{{- fail "ingress.enabled=true requires ingress.host." -}}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentforge.fullname" . }}
  labels:
    {{- include "agentforge.labels" . | nindent 4 }}
data:
  AGENTFORGE_ENVIRONMENT: {{ .Values.config.environment | quote }}
  AGENTFORGE_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  AGENTFORGE_AUTH_ENABLED: {{ .Values.auth.enabled | quote }}

  # Control-plane pods are always in-cluster. kubeconfig auth is a laptop-only
  # mode and has no place inside a pod that has a service account.
  AGENTFORGE_K8S_IN_CLUSTER: "true"

  # pydantic-settings parses complex values as JSON, so the list is serialized
  # rather than passed as a comma-separated string.
  AGENTFORGE_CORS_ORIGINS: {{ .Values.config.corsOrigins | toJson | quote }}

  # Workspaces. Each project becomes a namespace named "<prefix>-<project>".
  AGENTFORGE_WORKSPACE_NAMESPACE_PREFIX: {{ .Values.config.workspaceNamespacePrefix | quote }}
  AGENTFORGE_WORKSPACE_PROVIDER: {{ .Values.config.workspaceProvider | quote }}
  AGENTFORGE_WORKSPACE_IMAGE: {{ .Values.config.workspaceImage | quote }}
  AGENTFORGE_WORKSPACE_AGENT_IMAGE: {{ .Values.config.workspaceAgentImage | quote }}
  AGENTFORGE_WORKSPACE_AGENT_UID: {{ .Values.config.workspaceAgentUid | quote }}
  AGENTFORGE_WORKSPACE_AGENT_GID: {{ .Values.config.workspaceAgentGid | quote }}
  AGENTFORGE_WORKSPACE_CPU_REQUEST: {{ .Values.config.workspaceCpuRequest | quote }}
  AGENTFORGE_WORKSPACE_MEMORY_REQUEST: {{ .Values.config.workspaceMemoryRequest | quote }}
  AGENTFORGE_WORKSPACE_STORAGE: {{ .Values.config.workspaceStorage | quote }}
  AGENTFORGE_WORKSPACE_STORAGE_CLASS: {{ .Values.config.workspaceStorageClass | quote }}
  AGENTFORGE_WORKSPACE_CODE_SERVER_PORT: {{ .Values.config.workspaceCodeServerPort | quote }}

  # Agent runtime and model routing.
  AGENTFORGE_OPENHANDS_URL: {{ .Values.config.openhandsUrl | quote }}
  AGENTFORGE_LLM_GATEWAY_URL: {{ .Values.config.llmGatewayUrl | quote }}
  AGENTFORGE_DEFAULT_AGENT_MODEL: {{ .Values.config.defaultAgentModel | quote }}
