{{- if .Values.ingress.enabled -}}
{{/*
One host, one origin. /api goes straight to the API Service and everything else
to the dashboard, so the browser never makes a cross-origin request and the
WebSocket stream upgrade lands on the API.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "agentforge.fullname" . }}
  labels:
    {{- include "agentforge.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "agentforge.api.fullname" . }}
                port:
                  number: {{ .Values.api.service.port }}
          - path: /
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "agentforge.web.fullname" . }}
                port:
                  number: {{ .Values.web.service.port }}
{{- end }}
