# LiteLLM gateway config — the single OpenAI-compatible endpoint our agents use.
# An agent's `model` field is a logical alias; this file decides where it goes.
model_list:
  - model_name: local-coder
    litellm_params:
      model: ollama/qwen2.5-coder:32b
      api_base: http://ollama:11434
  - model_name: fast
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
  - model_name: smart
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
