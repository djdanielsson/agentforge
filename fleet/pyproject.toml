[project]
name = "fleet"
version = "0.1.0"
description = "AI coding agent fleet control plane"
requires-python = ">=3.11"

[tool.uv.workspace]
members = [
    "packages/core",
    "apps/control-plane",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency injection is expressed as a call in an argument default.
"apps/control-plane/src/fleet_api/routers/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "packages/core/src",
    "apps/control-plane/src",
]
