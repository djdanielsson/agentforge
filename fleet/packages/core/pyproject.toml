[project]
name = "fleet-core"
version = "0.1.0"
description = "Domain model, persistence and provider interfaces for the fleet control plane"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "kubernetes>=31.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_core"]
