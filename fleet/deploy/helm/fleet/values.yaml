# Fleet control-plane values.
#
# The image tag is set at deploy time by the build script; nothing here should
# need editing to redeploy a new build.

namespace: fleet

image:
  repository: registry.registry.svc:5000/fleet-api
  tag: latest
  pullPolicy: Always

replicaCount: 1

# The API token clients must present. Empty means an unauthenticated prototype,
# which the API logs loudly and reports at /api/v1/health.
apiToken: ""

# The LLM gateway. The master key is never a value here: it is copied into the
# namespace's own Secret by the deploy script, from the gateway that already
# runs in the cluster (SPEC §11).
llm:
  gatewayUrl: http://agentforge-llm.agentforge.svc.cluster.local:4000
  defaultModel: local-coder
  models:
    - local-coder
    - fast
    - smart
  secretName: fleet-llm

# DevPod is the workspace provider (SPEC §4). The control plane creates one
# namespace per project, named "<namespacePrefix><project>", through
# `devpod up --provider-option KUBERNETES_NAMESPACE=...`.
workspace:
  provider: devpod
  devpodVersion: v0.6.15
  # The devcontainer image DevPod provisions from. Reached anonymously, which
  # DevPod requires because it inspects the image manifest before starting.
  image: mcr.microsoft.com/devcontainers/base:ubuntu-24.04
  namespacePrefix: fleet-
  # The unprivileged user a workspace's agent run drops to. `opencode run`
  # deadlocks as uid 0 in this devcontainer image (see docs/FINDINGS.md §9.13).
  agentUser: vscode
  storageClass: local-path
  defaultStorage: 5Gi
  nodeVersion: v24.21.0
  opencodeVersion: 1.18.31
  t3Version: 0.0.40
  t3Enabled: true

# Where the control plane is reachable from inside a workspace, for the LLM
# proxy and for injected tokens.
controlPlaneUrl: ""

# The MCP server the control plane serves at /mcp, and that the T3 environment's
# agent CLIs are pointed at (docs/T3-INTEGRATION.md §A). Empty derives it from
# controlPlaneUrl.
mcp:
  url: ""

# The shared T3 Code environment: one environment, projects as checkouts on its
# own volume, exposed on the tailnet. `workspaceMode` projects are created
# against this; DevPod projects are unaffected.
t3:
  enabled: true
  image:
    repository: registry.registry.svc:5000/fleet-t3
    # Empty means "the same tag as the control plane image".
    tag: ""
  port: 5733
  # The ingress name, hence the MagicDNS name: <namespace>-<name>-ingress.<tailnet>.
  # It is the TLS identity, so it is not cosmetic — see the control plane's own
  # ingress below for what churning one costs.
  ingressName: t3
  ingress:
    enabled: true
  # Empty derives https://<namespace>-<ingressName>-ingress.<tailnet>.
  url: ""
  projectsPath: /projects
  # T3 Code's data directory (T3CODE_HOME), on the same volume.
  home: /state/t3code
  projectsStorage: 20Gi
  storageClass: local-path
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 3Gi

tailnetDomain: tail7f3c08.ts.net

persistence:
  enabled: true
  size: 5Gi
  storageClass: local-path

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

tailscaleIngress:
  enabled: true
  # The tailscale operator derives the MagicDNS name from the namespace and this
  # object's name: <namespace>-<name>-ingress.<tailnet>.
  #
  # The name is not cosmetic: it is the TLS identifier the operator asks Let's
  # Encrypt for, and that request is rate limited to five certificates per exact
  # hostname per week. The first name (`ts`) was created and destroyed repeatedly
  # while this deployment was being debugged, exhausted the limit and left the
  # ingress serving nothing but a TLS handshake error. A new name is a new
  # identifier, which is why this is `cp`.
  name: cp

service:
  # One number for the API everywhere: the container port, the ClusterIP port
  # the workspaces dial and the tailnet Ingress backend are all this value.
  # They were not, and it cost every agent run: workspaces were told to reach
  # `fleet-api.fleet.svc.cluster.local:8000` while the Service published 80.
  port: 8000
  targetPort: 8000
