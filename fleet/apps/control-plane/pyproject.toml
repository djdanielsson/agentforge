[project]
name = "fleet-api"
version = "0.1.0"
description = "Fleet control-plane API"
requires-python = ">=3.11"
dependencies = [
    "fleet-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_api"]

[tool.uv.sources]
fleet-core = { workspace = true }
