[project]
name = "agentforge-orchestrator"
version = "0.1.0"
description = "Reconciles projects, workspaces, agents and tasks"
requires-python = ">=3.11"
dependencies = [
    "agentforge-shared",
    "agentforge-workspaces",
    "agentforge-agent-server",
    "httpx>=0.27",
    "sqlalchemy>=2.0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentforge_orchestrator"]

[tool.uv.sources]
agentforge-shared = { workspace = true }
agentforge-workspaces = { workspace = true }
agentforge-agent-server = { workspace = true }
