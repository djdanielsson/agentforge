[project]
name = "agentforge-cli"
version = "0.1.0"
description = "Command-line client for the AgentForge API"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "websockets>=12.0",
]

[project.scripts]
agentforge = "agentforge_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentforge_cli"]
