[project]
name = "agentforge-api"
version = "0.1.0"
description = "AgentForge control-plane API"
requires-python = ">=3.11"
dependencies = [
    "agentforge-shared",
    "agentforge-workspaces",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentforge_api"]

[tool.uv.sources]
agentforge-shared = { workspace = true }
agentforge-workspaces = { workspace = true }
