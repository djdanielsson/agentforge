[project]
name = "aiw-orchestrator"
version = "0.1.0"
description = "Reconciles projects, workspaces, agents and tasks"
requires-python = ">=3.11"
dependencies = [
    "aiw-shared",
    "aiw-workspace-controller",
    "httpx>=0.27",
    "sqlalchemy>=2.0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiw_orchestrator"]

[tool.uv.sources]
aiw-shared = { workspace = true }
aiw-workspace-controller = { workspace = true }
